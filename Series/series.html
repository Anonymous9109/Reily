<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="content" style="display: none;">
    <div id="hero" class="hero"></div>

    <div class="container">
      <div class="series-header">
        <img id="poster" class="poster" src="" alt="Series Poster">
        <div class="meta">
          <h1 id="title" class="series-title"></h1>
          <p id="synopsis" class="synopsis"></p>
        </div>
      </div>

      <div id="seasonsBar" class="seasons-bar"></div>
      <div id="episodesList" class="episodes-list"></div>
    </div>
  </div>

  <div id="error-msg" style="display: none;">
    <h2>Series Not Found</h2>
  </div>

  <!-- JavaScript Files -->
  <script src="player-data.js"></script>
  <script src="series-data.js"></script>
  <script src="series.js"></script>
</body>
</html>
