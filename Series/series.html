<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Series - Rinolski</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      position: relative;
    }

    #ambientBg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.25);
      z-index: 0;
      pointer-events: none;
    }

    #movieContentWrapper {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #title {
      font-size: 2.2rem;
      font-weight: 800;
    }

    #desc {
      color: #ccc;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .episodes-container {
      margin-top: 24px;
    }

    .episodes-header {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 12px;
      border-bottom: 1px solid #262626;
      padding-bottom: 8px;
    }

    .episodes-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .episode-card {
      background: #0a0a0a;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .episode-card:hover {
      background: #141414;
      border-color: #404040;
    }

    .ep-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ep-key {
      color: #e50914;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .ep-title {
      color: #fff;
      font-size: 0.9rem;
    }

    .empty-state { color: #666; font-size: 0.85rem; padding: 12px 0; }
  </style>
</head>
<body>

  <div id="movieContentWrapper">
    <h1 id="title">Loading...</h1>
    <p id="desc"></p>
  </div>

  <script src="/Series/series.js"></script>
</body>
</html>
